services:
  db-dev:
    image: postgres:15
    container_name: db_dev
    restart: always
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: db_dev  # Corrigido aqui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d db_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:15
    container_name: db_test
    restart: always
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: db_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d db_test"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5433:5432"

volumes:
  pgdata: